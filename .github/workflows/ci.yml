name: CI
on:
  pull_request:
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: recipes_test
          POSTGRES_USER: recipes
          POSTGRES_PASSWORD: ci-only-password
          PGDATA: /var/lib/postgresql/18/docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recipes -d recipes_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://recipes:ci-only-password@127.0.0.1:5432/recipes_test
      DATABASE_QUERY_TIMEOUT_MS: "2000"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run db:check
      - run: npm run db:drift-check
      - run: npm run test:integration
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      - run: npm run test:e2e
        timeout-minutes: 5
      - run: docker build --tag recipes:v01 .
        timeout-minutes: 10
      - run: docker build --target maintenance --tag recipes:v01-maintenance .
        timeout-minutes: 5
      - run: npm run docker:config
      - name: Production container smoke and cleanup
        run: node scripts/smoke/production-local.mjs
        timeout-minutes: 5
