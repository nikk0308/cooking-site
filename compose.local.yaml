name: recipes-local
services:
  app:
    build:
      context: .
      target: development
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://recipes:recipes_dev_password@postgres:5432/recipes
      DATABASE_QUERY_TIMEOUT_MS: "2000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: recipes
      POSTGRES_USER: recipes
      POSTGRES_PASSWORD: recipes_dev_password
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipes -d recipes"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  app_node_modules:
  postgres_data:
